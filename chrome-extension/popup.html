<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maina — Discord RPC</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 320px;
      padding: 16px;
      background-color: #0a0a0c;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      overflow: hidden;
      border: 1px solid #222;
      border-radius: 8px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #1a1a24;
      margin-bottom: 14px;
    }
    .brand {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
    }
    .badge {
      font-size: 9px;
      font-family: monospace;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .badge-connected {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .badge-disconnected {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .track-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #111116;
      border: 1px solid #22222a;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 14px;
    }
    .track-cover {
      width: 52px;
      height: 52px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid #333;
      background: #1c1c24;
    }
    .track-info {
      flex: 1;
      min-width: 0;
    }
    .track-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 11px;
      color: #888;
      font-family: monospace;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
    }
    .toggle-label {
      font-size: 11px;
      font-family: monospace;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #333;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #5865F2; /* Discord Blurple */
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
    .footer {
      text-align: center;
      margin-top: 10px;
      font-size: 9px;
      color: #555;
      font-family: monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">MAINA // RPC</div>
    <div id="status-badge" class="badge badge-disconnected">Checking...</div>
  </div>

  <div id="track-card" class="track-card">
    <img id="cover-img" class="track-cover" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50' fill='%23333'><rect width='50' height='50'/></svg>" />
    <div class="track-info">
      <div id="track-title" class="track-title">No Track Active</div>
      <div id="track-artist" class="track-artist">Play music on Maina</div>
    </div>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Broadcast to Discord</span>
    <label class="switch">
      <input type="checkbox" id="rpc-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">
    Discord Activity Bridge V1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
